name: 'pr-trailer'
description: 'Reduces the time a human reviewer takes to approve a PR with confidence.  Generates an audio trailer of the pull request changes. The trailer covers the main intent, the places to focus more and potential risks exposed.  Listen to the trailer while you review the changes and approve or reject them with confidence. …It’s like a quick call with the author(s) without wasting anyone’s time.'
branding:
  icon: 'git-pull-request'
  color: 'purple'
inputs:
  api-key:
    description: 'pr-trailer-api key used to authenticate requests to the analysis service.'
    required: true
  api-url:
    description: 'Base URL of the deployed pr-trailer-api service.'
    required: true
  github-token:
    description: 'Token used to read PR data and post the comment.'
    required: false
    default: ${{ github.token }}
  exclude-files:
    description: 'Comma-separated list of filenames to exclude from diff extraction, overriding the default lockfile exclusions.'
    required: false
    default: 'package-lock.json,yarn.lock,pnpm-lock.yaml,Cargo.lock,poetry.lock'
runs:
  using: 'node24'
  main: 'dist/index.js'
