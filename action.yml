name: 'pr-trailer'
description: 'Reduces the time a human-reviewer takes to review a PR with confidence.'
branding:
  icon: 'git-pull-request'
  color: 'purple'
inputs:
  api-key:
    description: 'pr-trailer-api key used to authenticate requests'
    required: true
  api-url:
    description: 'Base URL of your pr-trailer-api'
    required: true
  github-token:
    description: 'Token used to read PR data and post the comment.'
    required: false
    default: ${{ github.token }}
  exclude-files:
    description: 'Comma-separated list of filenames to exclude from diff extraction, overriding the default lockfile exclusions.'
    required: false
    default: 'package-lock.json,yarn.lock,pnpm-lock.yaml,Cargo.lock,poetry.lock'
  verbosity:
    description: "Verbosity logs (error < warn < notice < info < debug)"
    required: false
    default: 'info'
runs:
  using: 'node24'
  main: 'dist/index.js'
